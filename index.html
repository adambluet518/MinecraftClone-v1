<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniCraft - Web Voxel Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="bg-music" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div id="game-container">
        <canvas id="game-canvas"></canvas>
    </div>

    <div id="crosshair">
        <div class="crosshair-line crosshair-h"></div>
        <div class="crosshair-line crosshair-v"></div>
    </div>

    <div id="hotbar">
        <div class="hotbar-slot selected" data-block="grass">
            <img src="grass.png" class="hotbar-icon" alt="Grass">
            <span class="hotbar-label">1</span>
        </div>
        <div class="hotbar-slot" data-block="dirt">
            <img src="dirt.png" class="hotbar-icon" alt="Dirt">
            <span class="hotbar-label">2</span>
        </div>
        <div class="hotbar-slot" data-block="cobblestone">
            <img src="cobblestone.png" class="hotbar-icon" alt="Stone">
            <span class="hotbar-label">3</span>
        </div>
        <div class="hotbar-slot" data-block="log">
            <img src="log_side.png" class="hotbar-icon" alt="Log">
            <span class="hotbar-label">4</span>
        </div>
        <div class="hotbar-slot" data-block="leaves">
            <img src="leaves.png" class="hotbar-icon" alt="Leaves">
            <span class="hotbar-label">5</span>
        </div>
        <div class="hotbar-slot" data-block="planks">
            <img src="planks.png" class="hotbar-icon" alt="Planks">
            <span class="hotbar-label">6</span>
        </div>
    </div>

    <div id="block-name">Grass</div>

    <div id="instructions">
        <h2>🎮 MiniCraft Controls</h2>
        <p><b>WASD</b> - Move | <b>Space</b> - Jump | <b>Mouse</b> - Look</p>
        <p><b>Left Click</b> - Mine | <b>Right Click</b> - Place</p>
        <p><b>1-6 / Scroll</b> - Select Block | <b>M</b> - Music</p>
        <p class="click-to-start">Click to play!</p>
    </div>

    <button id="music-toggle" title="Toggle Music">🔇</button>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module" src="game.js"></script>
</body>
</html>
